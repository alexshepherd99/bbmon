<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bbmon</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header>
    <h1>bbmon</h1>
    <p class="status" id="status">Loading&hellip;</p>
  </header>

  <main>
    <section class="card" id="speedtest-panel">
      <h2>Latest speed test</h2>
      <div class="readings">
        <div class="reading">
          <span class="reading-label">Download</span>
          <span class="reading-value" id="speedtest-download">&mdash;</span>
          <span class="reading-unit">Mbps</span>
        </div>
        <div class="reading">
          <span class="reading-label">Upload</span>
          <span class="reading-value" id="speedtest-upload">&mdash;</span>
          <span class="reading-unit">Mbps</span>
        </div>
        <div class="reading">
          <span class="reading-label">Latency</span>
          <span class="reading-value" id="speedtest-ping">&mdash;</span>
          <span class="reading-unit">ms</span>
        </div>
      </div>
      <p class="reading-meta" id="speedtest-meta">Waiting for the first speed test&hellip;</p>
    </section>

    <section class="card">
      <h2>Ping latency &mdash; last 2 hours</h2>
      <div id="latency-chart" class="chart"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Ping latency &mdash; last 24 hours, by hour</h2>
        <p class="card-note" id="hourly-note">Loading&hellip;</p>
      </div>
      <div id="hourly-chart" class="chart"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Speed test history</h2>
        <div class="controls" id="history-range" role="group" aria-label="History range">
          <button type="button" data-days="1">24h</button>
          <button type="button" data-days="7" class="selected" aria-pressed="true">7d</button>
          <button type="button" data-days="30">30d</button>
        </div>
      </div>
      <div id="history-chart" class="chart"></div>
      <p class="card-note" id="history-note">Loading&hellip;</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Restarts</h2>
        <label class="controls toggle">
          <input type="checkbox" id="hide-expected">
          Hide expected
        </label>
      </div>
      <table class="restarts">
        <thead>
          <tr><th>When</th><th>Kind</th><th>Reason</th></tr>
        </thead>
        <tbody id="restart-rows"></tbody>
      </table>
      <p class="card-note" id="restart-note">Loading&hellip;</p>
    </section>
  </main>

  <footer>
    <span>version {{ version }}</span>
    <span class="build">{{ build }}</span>
  </footer>

  <script src="{{ url_for('static', filename='vendor/echarts.min.js') }}"></script>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
