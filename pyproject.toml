[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbmon"
version = "0.1.0"
description = "Home broadband monitoring for a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["bbmon*"]

# Templates and vendored assets are not .py files, so they need naming
# explicitly or a non-editable install on the Pi ships a web app with no pages.
[tool.setuptools.package-data]
bbmon = ["web/templates/*.html", "web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
