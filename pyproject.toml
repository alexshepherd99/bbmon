[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbmon"
version = "0.1.0"
description = "Home broadband monitoring for a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["bbmon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
